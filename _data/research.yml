# ─────────────────────────────────────────────────────────────────────────────
# Research — every paper on the site comes from this file.
#
# Papers are grouped by `status` and appear in the order listed here.
#
#   title       (required)
#   status      (required)  published | working | progress | policy
#                 published → "Publications"   (also set `journal` and `year`)
#                 working   → "Working Papers"
#                 progress  → "Work in Progress"
#                 policy    → "Policy Reports", last on the Research page
#   jmp         true marks your job market paper. While job-market mode is on
#               (_data/profile.yml), it is shown first as "Job Market Paper",
#               with its abstract and figures open.
#   coauthors   list of names; their links live in _data/coauthors.yml
#   abstract    plain text or Markdown, opened by the "Abstract" toggle
#   figures     optional list of { src, alt, caption } shown with the abstract
#   links       optional list of { label, url }, e.g. Paper (PDF), Slides, SSRN.
#               They appear in one row before the "Abstract" toggle, and the
#               first link is also where the title points (policy report
#               titles aren't links).
#   note        optional short status line, e.g. "Revise & resubmit, AER"
#   abstract_note  optional text shown where the Abstract toggle would be, for a
#               paper whose abstract can't be posted yet, e.g. "Abstract coming soon"
#   coverage    optional list of { outlet, url } for press coverage, opened by a
#               "Coverage" toggle after the Abstract one
#
# To post a paper: put the PDF in /papers/ (e.g. papers/morris-jmp.pdf) and add
#   links:
#     - label: Paper
#       url: /papers/morris-jmp.pdf
# Keep the file name the same when you update a draft so links never break.
# ─────────────────────────────────────────────────────────────────────────────

- title: "Spell or Scar? Wildfire Damage and the Insurance of Job Loss"
  status: progress
  coauthors: [Anna Newman]
  abstract: >-
    Wildfires destroyed more than 70,000 structures in California between 2013
    and 2025, devastating communities and displacing thousands of workers. We
    study what happens to workers when a wildfire damages their workplace, and
    how much of their loss unemployment insurance replaces. We link CAL FIRE’s
    structure-level damage inspections to California’s confidential
    administrative records of earnings, employment, unemployment insurance
    claims, and benefit payments from 2010 to 2025. Exploiting the unpredictable
    timing of fire damage, we compare workers at establishments at or near
    damaged structures, before and after the fire, with matched workers at
    establishments untouched by fire. We find that damage near the workplace
    causes large and persistent earnings losses: four to five years after a
    fire, the quarterly earnings of workers at damaged establishments remain
    lower by about a fifth of their pre-fire level, for a cumulative loss of
    about $52,000 per worker over five years. By then, these workers are almost
    20 percentage points less likely to work for their pre-fire employer and
    nearly 10 points less likely to hold any covered job in California. We show
    that unemployment insurance responds quickly but briefly: claims spike in
    the quarter of the fire, but nearly all benefits are paid within a few
    quarters, such that they replace 13 percent of first-year losses and only 2
    percent of five-year losses.
  figures:
    - src: /assets/figures/fire-earnings-losses.webp
      width: 2405
      height: 1184
      alt: >-
        Line chart of the effect of workplace fire damage on quarterly earnings,
        from 12 quarters before to 20 quarters after the fire. Estimates are
        near zero before the fire, drop
        to about $1,400 below zero in the quarter of the fire, and stay between
        roughly $2,000 and $3,500 below zero through quarter 20.
      caption: >-
        Effect of fire damage near the workplace on quarterly earnings, relative
        to matched workers at undamaged establishments.
    - src: /assets/figures/fire-ui-replacement.webp
      width: 2405
      height: 1184
      alt: >-
        Line chart comparing the effect of fire damage on earnings with its
        effect on earnings plus unemployment insurance benefits, by quarter
        relative to the fire. The two lines separate only in the first few
        quarters after the fire, where a small shaded area marks the part of the
        loss replaced by benefits; afterwards they coincide at losses of $2,000
        to $3,500 per quarter.
      caption: >-
        Earnings losses with and without unemployment insurance benefits. The
        shaded area is the part of the loss replaced by benefits.

- title: Estimating the Cost of Advance Notice for Firms Conducting Mass Layoffs
  status: progress
  coauthors: [Sarah Bana]
  abstract: >-
    This paper investigates the impact of advance notice requirements on firm
    behavior during large-scale workforce reductions. We exploit discontinuous
    policy rules in the Employment Standards Act (ESA) to estimate the cost of
    additional notice requirements for firms conducting mass terminations in
    Ontario, Canada. Our novel empirical evidence shows that firms strategically
    manipulate the scale of layoffs to circumvent additional notice obligations.
    Specifically, we utilize quasi-experimental variation in notice requirements
    facilitated by the ESA to estimate an approximate 30% increase in the
    frequency of layoff events that bunch just below the threshold at which the
    mandatory notice period discontinuously increases from 8 to 12 weeks. These
    discrete jumps in mandatory notice reveal that the costs associated with
    additional notice provisions for displaced workers significantly distort
    firms' termination behavior during mass layoffs.
  figures:
    - src: /assets/figures/layoffs-by-size.webp
      width: 1800
      height: 1200
      alt: >-
        Scatter plot of the number of mass layoff events by number of employees
        terminated, from 0 to about 700. Dashed vertical lines mark 50, 200, and
        500 employees. Counts peak just above 50 and decline with layoff size,
        with visible spikes just below 200 and just below 500.
      caption: >-
        Layoff events by number of employees terminated. Dashed lines mark the
        50-, 200- and 500-employee thresholds in Ontario's mass termination
        notice rules.
    - src: /assets/figures/bunching-at-200.webp
      width: 1800
      height: 1200
      alt: >-
        Number of layoff events by number of employees terminated, from 50 to
        about 450, with a smooth fitted counterfactual curve. A shaded region
        between roughly 180 and 200 employees shows layoff counts well above the
        counterfactual just below the 200-employee threshold.
      caption: >-
        Excess mass of layoffs just below 200 employees, where required notice
        rises from 8 to 12 weeks, relative to a smooth counterfactual.

