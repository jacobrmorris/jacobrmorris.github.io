bio: |
  I am a PhD student in Economics at the University of California San Diego.

  My research is in labor and public economics, with a focus on job loss and
  policies meant to protect displaced workers.

  I am also a researcher at the
  [California Policy Lab](https://www.capolicylab.org) and California's
  [Employment Development Department](https://edd.ca.gov) (EDD), where I work
  with administrative unemployment insurance claims and linked
  employer–employee wage records.

fields: [Labor Economics, Public Economics]

