bio: |
  My research is in labor and public economics, with a focus on job loss and the
  policies meant to protect displaced workers.

  I am also a Graduate Research Fellow at the
  [California Policy Lab](https://www.capolicylab.org), where I work with
  administrative data from California's
  [Employment Development Department](https://edd.ca.gov) (EDD).

fields: [Labor Economics, Public Economics]

