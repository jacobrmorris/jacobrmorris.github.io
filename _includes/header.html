{%- comment -%}
  Top bar on every page: name on the left; Home, Research and the CV (PDF) on
  the right, with the current page underlined.
{%- endcomment -%}
<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <nav class="tabs" aria-label="Site">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/research/' | relative_url }}"{% if page.url == "/research/" %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ site.data.profile.cv | relative_url }}">CV<span class="visually-hidden"> (PDF)</span></a>
    </nav>
  </div>
</header>
